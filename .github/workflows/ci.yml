# Workflow for mlightcad CI/CD
name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  # Needed to delete stale github-pages artifacts left by previous attempts of the same run.
  actions: write

# Avoid overlapping main deploys; do not cancel in-progress so a deploy can finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@mlightcad'

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Build projects
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Run LibreDWG DXF round-trip tests
        run: pnpm test:node

      - name: Build API docs
        run: pnpm doc

      # Authenticates via npm Trusted Publishing (OIDC); no NPM_TOKEN needed.
      # Configure each package on npmjs.com → Settings → Trusted publishing:
      #   Provider: GitHub Actions
      #   Repository: mlightcad/realdwg-web
      #   Workflow filename: ci.yml
      #   Environment: release  (must match the job environment below)
      - name: Publish packages to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm --version
          # setup-node writes an empty _authToken line that blocks OIDC fallback
          if [ -f "$HOME/.npmrc" ]; then
            sed -i '/_authToken/d' "$HOME/.npmrc"
          fi
          pnpm publish:package

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      # Artifacts are scoped to the workflow run, not the attempt. Re-running the
      # build job uploads another "github-pages" artifact and deploy-pages fails with
      # "Multiple artifacts named github-pages". Clear any leftovers first.
      - name: Delete stale github-pages artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --paginate --jq '.artifacts[] | select(.name=="github-pages") | .id' \
            | while read -r id; do
              echo "Deleting stale github-pages artifact $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            done

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs/'

  # Deploy in a separate job so artifact listing happens after the upload job has
  # fully completed. Same-job upload→deploy races on Actions artifact visibility
  # and intermittently fails with "Found 0 artifact(s)" (actions/deploy-pages#451).
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: main
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
